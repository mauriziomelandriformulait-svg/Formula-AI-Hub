<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula AI-Tech</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
        
        :root {
            --bg: #f8fafc; --surface: #ffffff; --border: #cbd5e1; --text: #1e293b;
            --accent: #00aabb; --shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        body { 
            margin: 0; font-family: 'Figtree', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; padding: 2rem 0;
        }

        h1 { 
            font-size: 24px; 
            font-weight: 700; 
            margin-bottom: 2.5rem; 
            color: #111; 
            letter-spacing: -0.5px; 
        }

        .grid-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
            max-width: 900px; width: 90%; margin-bottom: 20px;
        }

        @media (max-width: 850px) { 
            .grid-container { grid-template-columns: repeat(2, 1fr); } 
        }

        .map-card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 12px; 
            padding: 25px 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            box-shadow: var(--shadow); 
            transition: transform 0.2s, border-bottom-color 0.2s; 
            border-bottom: 10px solid #FFCC00; 
            cursor: pointer; 
            text-decoration: none; 
            color: var(--text); 
        }

        .map-card:hover { 
            transform: translateY(-5px); 
            border-bottom-color: #eab308; 
        }

        .icon { 
            width: 32px; 
            height: 32px; 
            fill: none; 
            stroke: currentColor; 
            stroke-width: 1.5; 
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        .label { 
            font-size: 14px; 
            font-weight: 700; 
            text-align: center; 
        }
    </style>
</head>
<body>

  <h1>Formula AI-Tech</h1>

  <!-- Prima Riga -->
  <div class="grid-container">
    <div class="map-card" onclick="inviaMessaggioNavigazione('https://diapdemo.formula.it:8282/due/#/home/desktop/AI%20-%20Agent%20Query')">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span class="label">AI-Agent Query</span>
    </div>

    <div class="map-card" onclick="inviaMessaggioNavigazione('https://diapdemo.formula.it:8282/due/#/home/desktop/AI%20-%20Document%20Intelligence')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      <span class="label">AI-Document Intelligence</span>
    </div>

    <div class="map-card" onclick="inviaMessaggioNavigazione('https://diapdemo.formula.it:8282/due/#/home/desktop/AI-Agentic%20Flow')">
      <svg class="icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      <span class="label">AI-Agentic Flow</span>
    </div>
  </div>

  <!-- Seconda Riga -->
  <div class="grid-container">
    <div class="map-card" onclick="inviaMessaggioNavigazione('https://diapdemo.formula.it:8282/due/#/home/desktop/AI%20-%20Predictive%20Engine')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
      <span class="label">AI-Predictive Engine</span>
    </div>

    <div class="map-card" onclick="inviaMessaggioNavigazione('https://diapdemo.formula.it:8282/due/#/home/desktop/AI%20-%20Sales%20Accelerator')">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span class="label">AI-Sales Accelerator</span>
    </div>

    <div class="map-card" onclick="inviaMessaggioNavigazione('https://diapdemo.formula.it:8282/due/#/home/desktop/AI%20-%20Ricerca%20Fornitori')">
      <svg class="icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span class="label">AI-Finder</span>
    </div>
  </div>

  <script>
      function inviaMessaggioNavigazione(percorsoTarget) {
          let routePath = percorsoTarget.includes('#') ? percorsoTarget.split('#')[1] : percorsoTarget;
          const payload = { type: 'ROUTER_NAVIGATION', action: 'navigate', url: percorsoTarget, route: routePath };
          window.parent.postMessage(payload, '*');
      }
  </script>
</body>
</html>
